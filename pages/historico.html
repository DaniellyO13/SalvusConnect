
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SalvusConnect - Histórico</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/historico.css?v=5">
    <link rel="icon" href="./SalvusConnect.jpg" type="image/jpeg">

    <!-- Lucide Icons -->
    <script
        src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"
        integrity="sha256-u4LvZOBXQxTtbZJd5uYAlpESLruJD6ZRt3WD8OPVNU8="
        crossorigin="anonymous">
    </script>
</head>

<body>

    <!-- Sidebar e Navbar compartilhadas pelo sidebar.js -->

    <!-- Conteúdo principal -->
    <main class="main-container">

        <section class="history-page">

            <!-- Cabeçalho -->
            <section class="page-header">

                <nav class="page-navigation" aria-label="Navegação da página">

                    <a
                        href="dashboard.html"
                        class="page-nav-button"
                        aria-label="Voltar para a página inicial">

                        <i data-lucide="arrow-left" aria-hidden="true"></i>
                        <span>Voltar</span>

                    </a>

                </nav>

                <h1>Histórico de Serviços</h1>
                <p class="history-subtitle">
                    Consulte seus serviços concluídos e avaliações.
                </p>

            </section>

            <!-- Carregamento -->
            <section
                class="loading-history"
                id="loadingHistory">

                <div class="history-skeleton"></div>
                <div class="history-skeleton"></div>
                <div class="history-skeleton"></div>

            </section>

            <!-- Histórico vazio -->
            <section
                class="empty-history"
                id="emptyHistory">

                <div class="empty-history-icon">
                    <i data-lucide="clipboard-list" aria-hidden="true"></i>
                </div>

                <h2>Sem histórico</h2>

                <p>
                    Você ainda não possui serviços concluídos.
                </p>

            </section>

            <!-- Lista de serviços -->
            <section
                class="history-list"
                id="historyList">
            </section>

        </section>

    </main>

    <!-- Modal de avaliação -->
    <div
        class="modal-overlay"
        id="reviewModal">

        <div class="review-modal">

            <div class="modal-header">

                <h2 id="reviewModalTitle">
                    Avaliar Serviço
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="closeReviewModal"
                    aria-label="Fechar">

                    ×

                </button>

            </div>

            <div class="modal-content">

                <div class="review-service-info">

                    <p
                        class="review-service-name"
                        id="reviewServiceName">
                    </p>

                    <p
                        class="review-target-name"
                        id="reviewTargetName">
                    </p>

                </div>

                <!-- Nota -->
                <div class="rating-section">

                    <label>Sua nota</label>

                    <div
                        class="rating-stars"
                        id="ratingStars">

                        <button type="button" data-rating="1">☆</button>
                        <button type="button" data-rating="2">☆</button>
                        <button type="button" data-rating="3">☆</button>
                        <button type="button" data-rating="4">☆</button>
                        <button type="button" data-rating="5">☆</button>

                    </div>

                </div>

                <!-- Comentário -->
                <div class="comment-section">

                    <label for="reviewComment">
                        Comentário (opcional)
                    </label>

                    <textarea
                        id="reviewComment"
                        placeholder="Conte como foi sua experiência..."
                        rows="4"></textarea>

                </div>

                <p
                    class="review-error"
                    id="reviewError">
                </p>

                <button
                    type="button"
                    class="submit-review-button"
                    id="submitReviewButton">

                    Enviar Avaliação

                </button>

            </div>

        </div>

    </div>

    <!-- JavaScript do histórico -->
    <script src="../js/historico.js?v=6"></script>

    <!-- Sidebar compartilhada -->
    <script src="../js/sidebar.js"></script>

    <!-- Inicialização dos ícones -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>

</body>
</html>
